<!DOCTYPE html>
<html>
<head>
  <title>DNS Integrity Alerts</title>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
</head>
<body>
  <div class="container">
    <h1>Recent DNS Alerts</h1>
    <div class="toggle-container">
      <label class="switch">
        <input type="checkbox" id="extension-enabled-toggle">
        <span class="slider round"></span>
      </label>
      <span id="toggle-label">Monitoring Enabled</span>
    </div>
    <div id="status">Loading alerts...</div>
    <ul id="alert-list">
      <!-- Alerts will be populated here by popup.js -->
    </ul>
    <button id="clear-alerts-btn" class="button">Clear All Alerts</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
